# ─────────────────────────────────────────────────────────────
# LINK-SMART — Netlify configuration (frontend SPA)
#
# The backend is Firebase (Auth, Firestore, Storage, Cloud
# Functions). Netlify only hosts the built Vite application, so no
# Netlify Functions are required. Cloud Functions are deployed with
# the Firebase CLI, not Netlify (see README.md §5).
# ─────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Defined exactly once. Do not add a duplicate [build.environment].
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback: refresh / deep-link any route without a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the HTML shell so new deploys are picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers for all responses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Fingerprinted build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
